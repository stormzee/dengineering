[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dengineering"
version = "0.1.0"
description = "A collection of data engineering pipelines"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pyarrow>=14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["dengineering*"]
